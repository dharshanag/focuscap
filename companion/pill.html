<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Focus Cap</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
      body {
        display: flex; align-items: center; justify-content: flex-end;
        padding: 8px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-user-select: none; user-select: none;
      }
      /* Same look as the in-page badge (content.js), so it reads as one system. */
      .pill {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 8px 14px; border-radius: 999px;
        font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums;
        color: #f87171; background: rgba(20, 20, 31, 0.94);
        border: 1px solid rgba(248, 113, 113, 0.5);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        white-space: nowrap;
      }
      .domain { color: #e7e7f0; }
      .label { opacity: 0.7; font-weight: 500; }
    </style>
  </head>
  <body>
    <div class="pill">
      <span>🔒</span>
      <span class="domain" id="domain">a tracked site</span>
      <span class="label" id="label">is out of time today</span>
    </div>
    <script src="pill.js"></script>
  </body>
</html>
