<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Focus Cap</title>
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body>
    <header>
      <h1>Focus Cap</h1>
      <div id="statusPill" class="pill on">—</div>
    </header>

    <section class="budget-box">
      <div id="remaining" class="remaining big"></div>
      <div class="bar"><div id="barFill" class="bar-fill"></div></div>
      <label class="budget-label">
        Daily limit
        <span><input id="budgetInput" type="number" min="0.5" step="0.5" /> min</span>
      </label>
      <div id="budgetNote" class="budget-note" hidden>
        Limit reached — you can't add time until tomorrow.
      </div>
    </section>

    <section>
      <h2>Blocked sites</h2>
      <ul id="siteList" class="site-list"></ul>
      <form id="addForm" class="add-form">
        <input id="domainInput" type="text" placeholder="youtube.com" autocomplete="off" />
        <button type="submit">Add</button>
      </form>
    </section>

    <section class="settings">
      <h2>Settings</h2>
      <label>
        Idle pause after
        <input id="idleInput" type="number" min="5" step="5" /> s
      </label>
    </section>

    <script src="dashboard.js"></script>
  </body>
</html>
